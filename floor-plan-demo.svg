<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">二樓巡邏區示範平面圖</title>
  <desc id="description">包含監舍 A 區、監舍 B 區、中央走道、值勤台、樓梯與示範感測節點。</desc>
  <rect width="1200" height="760" fill="#102028"/>
  <rect x="38" y="38" width="1124" height="684" rx="20" fill="#172c35" stroke="#78a9b8" stroke-width="5"/>
  <rect x="78" y="90" width="410" height="230" rx="12" fill="#1e3a43" stroke="#5dd9c1" stroke-width="4"/>
  <text x="283" y="160" fill="#f4f8f7" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">監舍 A 區</text>
  <text x="283" y="210" fill="#b8d4da" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">ZONE 2F-A</text>
  <path d="M105 250h356M195 90v230M372 90v230" stroke="#476b75" stroke-width="3"/>
  <rect x="712" y="90" width="410" height="230" rx="12" fill="#1e3a43" stroke="#e8a85b" stroke-width="4"/>
  <text x="917" y="160" fill="#f4f8f7" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">監舍 B 區</text>
  <text x="917" y="210" fill="#b8d4da" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">ZONE 2F-B</text>
  <path d="M739 250h356M829 90v230M1006 90v230" stroke="#476b75" stroke-width="3"/>
  <rect x="78" y="360" width="1044" height="120" rx="14" fill="#24414a" stroke="#78a9b8" stroke-width="3"/>
  <text x="600" y="435" fill="#f4f8f7" font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">中央巡邏走道</text>
  <rect x="78" y="525" width="300" height="150" rx="12" fill="#28434a" stroke="#5dd9c1" stroke-width="4"/>
  <text x="228" y="590" fill="#f4f8f7" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">值勤台</text>
  <text x="228" y="632" fill="#b8d4da" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">中央台構介接</text>
  <rect x="822" y="525" width="300" height="150" rx="12" fill="#28434a" stroke="#e8a85b" stroke-width="4"/>
  <text x="972" y="590" fill="#f4f8f7" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">樓梯／電梯</text>
  <text x="972" y="632" fill="#b8d4da" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">高風險指令需確認</text>
  <g fill="#5dd9c1" stroke="#102028" stroke-width="4">
    <circle cx="520" cy="420" r="17"/><circle cx="600" cy="420" r="17"/><circle cx="680" cy="420" r="17"/>
  </g>
  <text x="600" y="535" fill="#8fe7d6" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">攝影機／聲音／空間感測節點</text>
</svg>
